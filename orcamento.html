<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Orçamento | JIMO Eletrônica</title>
    <meta name="description" content="Solicite seu orçamento grátis para conserto de Smart TV ou eletrônicos em geral.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2300a8ff%22/><text x=%2250%%22 y=%2265%%22 font-size=%2260%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>J</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { brand: { dark:'#030f1d', navy:'#05182c', blue:'#007bbd', cyan:'#00a8ff', lightCyan:'#00e5ff', accent:'#00c6ff', slate:'#13283f' } },
                fontFamily: { sans: ['Poppins', 'sans-serif'] }
            }}
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="circuit-pattern antialiased text-slate-100 flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow pt-32 pb-20">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <span class="text-brand-cyan font-semibold text-xs tracking-widest uppercase bg-brand-cyan/10 px-3.5 py-1.5 rounded-full border border-brand-cyan/30"><i class="fa-solid fa-calculator mr-1"></i> Orçamento Online</span>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white mt-4">Solicite seu Orçamento</h1>
                <p class="text-slate-300 text-sm mt-2">Preencha os dados. O formulário gera o atendimento no WhatsApp.</p>
            </div>

            <div class="bg-brand-slate/90 rounded-3xl p-6 sm:p-10 border border-brand-cyan/30 shadow-2xl">
                <form id="formOrcamento" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2" for="nome">Nome Completo *</label>
                            <input type="text" id="nome" required placeholder="Ex: João da Silva" class="w-full bg-brand-dark/90 border border-slate-700 focus:border-brand-cyan rounded-xl py-3 px-4 text-sm text-white placeholder-slate-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2" for="whatsapp">WhatsApp *</label>
                            <input type="tel" id="whatsapp" required placeholder="(91) 98888-8888" class="w-full bg-brand-dark/90 border border-slate-700 focus:border-brand-cyan rounded-xl py-3 px-4 text-sm text-white placeholder-slate-500 outline-none transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2" for="tipoEquipamento">Equipamento *</label>
                            <select id="tipoEquipamento" required class="w-full bg-brand-dark/90 border border-slate-700 focus:border-brand-cyan rounded-xl py-3 px-3 text-sm text-white outline-none transition">
                                <option value="" disabled selected>Selecione...</option>
                                <option value="Smart TV / TV LED">Smart TV / TV LED/OLED</option>
                                <option value="Placa Eletrônica">Placa Eletrônica</option>
                                <option value="Aparelho de Som">Som / Amp</option>
                                <option value="Micro-ondas">Micro-ondas</option>
                                <option value="Outro Eletrônico">Outro Eletrônico</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2" for="marca">Marca</label>
                            <input type="text" id="marca" placeholder="Samsung, LG..." class="w-full bg-brand-dark/90 border border-slate-700 focus:border-brand-cyan rounded-xl py-3 px-4 text-sm text-white placeholder-slate-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2" for="modelo">Modelo</label>
                            <input type="text" id="modelo" placeholder="Ex: 55UN7310" class="w-full bg-brand-dark/90 border border-slate-700 focus:border-brand-cyan rounded-xl py-3 px-4 text-sm text-white placeholder-slate-500 outline-none transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-2" for="defeito">Defeito *</label>
                        <textarea id="defeito" rows="4" required placeholder="Descreva o problema..." class="w-full bg-brand-dark/90 border border-slate-700 focus:border-brand-cyan rounded-xl p-4 text-sm text-white placeholder-slate-500 outline-none transition resize-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 text-white font-bold py-4 rounded-xl shadow-xl transition flex items-center justify-center gap-3">
                        <i class="fa-brands fa-whatsapp text-2xl"></i> Enviar Orçamento pelo WhatsApp
                    </button>
                </form>

                <div id="orcamentoFeedback" class="hidden mt-6 p-4 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-sm text-center">
                    <i class="fa-solid fa-circle-check text-xl mb-1 block"></i>
                    <strong>Redirecionando...</strong>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>
    <script src="js/script.js"></script>
    <script src="js/orcamento.js"></script>
</body>
</html>
